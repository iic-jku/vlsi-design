project:
   type: website
   render:
     - index.qmd
     - vlsi.qmd

var:
  url-repo: https://github.com/iic-jku/vlsi-design   # to call this value : {{< meta var.url-repo >}}

website:
  title: "VLSI Design"
  favicon: favicon.png
  navbar:
    background: "#447099"
    search: true
    left:
      - icon: house
        href: index.qmd
        text: "About"
      - href: vlsi.qmd
        text: "Course Material"
      - icon: bi-filetype-pdf
        text: PDF
        href: vlsi.pdf
    right:
      - icon: github
        href: "{{< meta var.url-repo >}}"
        target: "_blank"

  page-footer:
    right: |
      Website built with [Quarto](https://quarto.org/){.external target="_blank"}
    left: |
      [Source code]({{< meta var.url-repo >}}){.external target="_blank"}
execute:
  freeze: auto

format:
  html:
    theme:
      light: cosmo
      dark: solar
    fig-align: center
    lang: en-US
    lightbox: true
