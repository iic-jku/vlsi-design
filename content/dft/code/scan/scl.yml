# Description: The flip-flops and the multiplexer of SG13CMOS5L for
# Fault (fault cut, fault chain).

dffMatches:
  - name: sg13cmos5l_dfrbpq_*
    d: D
    q: Q
    clk: CLK
muxInfo:
  name: sg13cmos5l_mux2_1
  a: A1  # selected when S is 1
  b: A0  # selected when S is 0
  s: S
  "y": X
  invertedOutput: false
